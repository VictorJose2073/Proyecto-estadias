<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Servicio técnico y reparación profesional de laptops en HRL Refacciones Laptop."
    />
    <title>HRL Refacciones Laptop</title>
    <!-- Aplica el tema antes de pintar para que no parpadee: elección guardada o la del sistema -->
    <script>
      try {
        var saved = localStorage.getItem('hrl-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light')
      } catch (error) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
